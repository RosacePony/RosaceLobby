# Local build + run (for development or a server with the sources checked out).
# For Portainer use docker-compose.portainer.yml (pulls the prebuilt image, no build).
services:
  lobby:
    build: .
    image: rosace-lobby:local
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      - "7777:7777/udp"
      - "7778:7778/udp"
    environment:
      LOBBY_LOG: info
      LOBBY_EXPIRE_SECS: "20"
      LOBBY_HEARTBEAT_SECS: "5"
      RELAY_MAX_SESSIONS: "512"
      RELAY_BYTES_PER_SEC: "1000000"
